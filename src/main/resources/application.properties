spring.application.name=BookingsSystem
spring.jackson.mapper.accept-case-insensitive-enums=true

spring.datasource.url=jdbc:h2:file:./data/bookingdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true

jwt.secret=${JWT_SECRET:dev-placeholder-secret-change-in-production-32chars-minimum-for-hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}


